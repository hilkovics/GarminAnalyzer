# Always-on home server (Raspberry Pi / mini PC / NAS) – docs/SERVER.md has the step-by-step setup.
#
#   scripts/server_setup.sh        # once: .env, build, start, Tailscale HTTPS
#   docker compose up -d --build   # after `git pull`
#
# Services (one image):
#   app      – the React app + API (`training api`) on 127.0.0.1:8000 of the host only; phones and PCs reach it
#              through Tailscale (`tailscale serve` → https://<host>.<tailnet>.ts.net). The API has no login, so the
#              port is never published on the LAN.
#   morning  – `training morning --loop`: sync → plan → push to Garmin → Telegram, daily at MORNING_AT
#              (default 09:00) in TZ; a missed day (host off at 09:00) is caught up on start.
#   streamlit – the old UI, only with `docker compose --profile streamlit up -d` (port 8501 on 127.0.0.1).
#
# data/ (SQLite DB, logs, reports) and the token directory are bind mounts: rebuilding the image loses nothing.
# Secrets (Telegram, Anthropic) go into .env next to this file – never into this file.
x-common: &common
  image: garmin-analyzer:latest
  restart: unless-stopped
  # run as the host user so the token file and data/ keep their owner (UID/GID in .env)
  user: "${UID:-1000}:${GID:-1000}"
  env_file:
    - path: .env
      required: false
  environment:
    TZ: ${TZ:-Europe/Bratislava}
  volumes:
    - ./data:/app/data
    - ${GARMIN_TOKENS_DIR:-${HOME}/.garminconnect}:/tokens

services:
  app:
    <<: *common
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3

  morning:
    <<: *common
    pull_policy: never  # same image as `app`, built locally
    depends_on:
      app:
        condition: service_started
    command: ["training", "morning", "--loop", "--at", "${MORNING_AT:-09:00}"]

  streamlit:
    <<: *common
    pull_policy: never
    profiles: ["streamlit"]
    ports:
      - "127.0.0.1:8501:8501"
    command: ["streamlit", "run", "ui-streamlit/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
