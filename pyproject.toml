[project]
name = "training"
version = "0.1.0"
description = "Personal training analytics for run + bike from Garmin Connect (HR-based, no power)."
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "garminconnect>=0.3.17,<0.4",
    "requests>=2.32",  # used directly for network-error classification in garmin/client.py
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "pydantic-settings>=2.5",
    "rich>=13.9",
    "scipy>=1.14",
    "sqlmodel>=0.0.22",
    "statsmodels>=0.14",
    "streamlit>=1.40",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
training = "training.cli:app"

[project.optional-dependencies]
ai = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/training"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow en dash / ≤ etc. in strings and docstrings (METRICS notation)

[tool.ruff.lint.isort]
known-first-party = ["training"]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query", "fastapi.Path"]
